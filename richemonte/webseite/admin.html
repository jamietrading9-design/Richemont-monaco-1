<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Richemont Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
      :root{ color-scheme: dark; }
      html,body{ height:100%; }
      body {
        margin:0; padding:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background: #000; color:#fff; font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      .card {
        width: min(760px, 96%);
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 24px;
        padding: 20px 24px;
        box-shadow: 0 14px 40px rgba(0,0,0,0.6);
      }

      .logo-container {
        position: fixed; top: 28px; left: 50%; transform: translateX(-50%); z-index:2100; text-align:center;
        pointer-events: none;
      }
      .logo {
        pointer-events: auto; font-family: 'Great Vibes', cursive; font-size:28px; color:#fff; text-decoration:none; display:inline-block; line-height:1;
      }

      .brand { display:none; }

      #error{ color:#ff8a8a; display:none; margin-bottom:8px; }

      .form-field { width:100%; margin-top:12px; }
      input {
        width:100%; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,0.08);
        padding:10px 0; color:#fff; font-size:14px; outline:none; font-weight:400; letter-spacing:0.2px;
      }
      input:focus { border-bottom-color: rgba(255,255,255,0.22); }

      .actions { margin-top:16px; display:block; }
      button {
        width:100%; min-height:44px; padding:12px 16px; border-radius:0; border:1px solid #fff;
        background: transparent; color:#fff; font-weight:700; font-size:12px; cursor:pointer; letter-spacing:0.14em; text-transform:uppercase;
        display:inline-flex; align-items:center; justify-content:center;
      }
      button.primary { background: transparent; color:#fff; border-color: #fff; }

      button:hover { background:#fff; color:#000; }

      .helper { margin-top:12px; color:#9aa; font-size:13px; }
    </style>
  </head>
  <body>
    <div class="logo-container"><a class="logo" href="/">Richemont Monaco</a></div>
    <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 16px;">
      <div class="card" style="max-width:360px; width:100%; padding:20px;">
        <div id="error" class="error" role="alert" style="display:none; margin-bottom:6px"></div>
        <input id="username" placeholder="Benutzername" autocomplete="username" />
        <input id="password" type="password" placeholder="Passwort" autocomplete="current-password" />
        <button id="loginBtn" class="primary">Anmelden</button>
        <p class="helper"><a href="/index.html">Zur Startseite</a></p>
      </div>
    </main>

    <script>
      async function doLogin() {
        const errorEl = document.getElementById('error');
        errorEl.style.display = 'none';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) {
          errorEl.textContent = 'Bitte Benutzername und Passwort eingeben.';
          errorEl.style.display = 'block';
          return;
        }

        try {
          const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await resp.json();
          if (!resp.ok || !data.success) {
            errorEl.textContent = data.error || 'Login fehlgeschlagen';
            errorEl.style.display = 'block';
            return;
          }
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('richemont_admin_token', data.token);
          window.location.href = '/dashboard.html';
        } catch (err) {
          errorEl.textContent = 'Netzwerkfehler, bitte erneut versuchen.';
          errorEl.style.display = 'block';
        }
      }

      document.getElementById('loginBtn').addEventListener('click', doLogin);
      document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    </script>
  </body>
</html>
