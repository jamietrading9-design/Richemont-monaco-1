<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Collections – Richemont</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/responsive.css">
<script src="products-data.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #000;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
}

nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2000;
    padding: 30px 40px;
    background: transparent;
    pointer-events: none;
    display: flex;    justify-content: space-between;

    align-items: center;
}

.menu-toggle {
    font-family: 'Great Vibes', cursive; 
    font-size: 32px;                     
    letter-spacing: 2px;               
    cursor: pointer;
    color: #fff;
    pointer-events: auto;
    display: inline-block;
    mix-blend-mode: difference;
    text-decoration: none;
    line-height: 1;
    transition: opacity 0.3s;
}

.menu-toggle:hover {
    opacity: 0.7;
}

.cart-icon {
    width: 40px;
    height: 40px;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-decoration: none;
    color: #fff;
}

.cart-icon::before {
    content: "🛒";
    font-size: 20px;
    font-weight: 300;
    opacity: 0.9;
}

.cart-count {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #fff;
    color: #000;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
}

.logo-container {
    position: fixed;
    top: 30px; 
    left: 50%;
    transform: translateX(-50%);
    z-index: 2100;
    white-space: nowrap;
    text-align: center;
}

.logo {
    font-family: 'Great Vibes', cursive;
    font-size: 28px; 
    color: #fff;
    text-decoration: none;
    transition: opacity 0.3s;
    display: inline-block;
}

.logo:hover {
    opacity: 0.7;
}

.side-menu {
    position: fixed;
    top: 0;
    left: -320px;
    width: 300px;
    height: 100vh;
    padding-top: 120px;
    padding-bottom: 40px;
    background: #080808;
    border-right: 1px solid rgba(255,255,255,0.05);
    transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 3000;
    display: flex;
    flex-direction: column;
}
.side-menu.active { left: 0; }
.side-menu a {
    color: #888;
    text-decoration: none;
    padding: 20px 40px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}

.side-menu a:hover { color: #fff; }
.menu-login {
    color: #888;
    text-decoration: none;
    padding: 20px 40px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}
.menu-login:hover { color: #fff; }

.menu-cart-icon {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 40px;
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s;
    text-decoration: none;
}

.menu-cart-icon:hover { color: #fff; }

.menu-cart-icon::before {
    display: none;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 2500;
}
.overlay.active { opacity: 1; pointer-events: auto; }

.collections-header {
    margin-top: 150px;
    text-align: center;
    padding-bottom: 50px;
}

.collections-header h1 {
    font-size: 10px;
    letter-spacing: 8px;
    text-transform: uppercase;
    font-weight: 300;
    opacity: 0.6;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
    max-width: 1600px;
    margin: 0 auto 100px auto;
}

.collection-item {
    position: relative;
    height: 80vh;
    overflow: hidden;
    text-decoration: none;
    background: #050505;
}

.collection-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0.8;
}

.collection-item:hover img {
    transform: scale(1.05);
    opacity: 1;
}

.collection-info {
    position: static;
    margin-top: 10px;
    padding: 0 20px;
    color: #fff;
}

.collection-info h2 {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    margin: 5px 0;
}

footer {
    background: #000;
    padding: 100px 40px 40px;
    border-top: 1px solid rgba(255,255,255,0.05);
    text-align: center;
}

.footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
}

.footer-logo {
    font-family: 'Great Vibes', cursive;
    font-size: 40px;
    color: #fff;
    text-decoration: none;
}

.footer-links {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.footer-links a {
    color: #666;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}

.footer-links a:hover {
    color: #fff;
}

.footer-bottom {
    margin-top: 60px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
}

@media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .collection-item { height: 60vh; }
    .footer-links { flex-direction: column; gap: 20px; }
    
    nav { padding: 20px 20px; }
    
    .logo {
        font-size: 24px;
    }
}

@media (max-width: 480px) {
    .collection-item { height: 50vh; }
    .logo { font-size: 20px; }
}
.filter-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
    padding: 0 20px;
}
.filter-btn {
    background: transparent;
    border: none;
    color: #555;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s, border-color 0.3s;
    padding: 6px 12px;
    border-bottom: 1px solid transparent;
}
.filter-btn:hover {
    color: #fff;
}
.filter-btn.active {
    color: #fff;
    border-bottom-color: #fff;
}
</style>
</head>
<body>

<nav>
    <a href="#" onclick="toggleMenu(); return false;" class="menu-toggle">RM</a>
    <a href="cart.html" class="cart-icon">
        <span id="cartCount" class="cart-count" style="display: none;">0</span>
    </a>
</nav>

<div class="logo-container">
    <a href="index.html" class="logo">Richemont Monaco</a>
</div>

<div class="side-menu" id="sideMenu">
        <a href="index.html">Home</a>
        <a href="collections.html">Collections</a>
        <a href="showroom.html">Showroom</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="menu-cart-icon">Warenkorb</a>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<main>
    <div class="collections-header">
        <h1>Collections</h1>
    </div>

    <section class="grid" id="collectionsGrid">
        <div style="grid-column: 1 / -1; text-align:center; padding:100px 0; color:#666; font-size:12px; letter-spacing:2px; text-transform:uppercase;">
            Kollektionen werden geladen...
        </div>
    </section>
</main>

<footer>
    <div class="footer-content">
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="collections.html">Collections</a>
            <a href="showroom.html">Showroom</a>
            <a href="contact.html">Contact</a>
            <a href="#">Instagram</a>
            <a href="impressum.html">Impressum</a>
        </div>
        <div class="footer-bottom">&copy; 2026 Richemont Monaco</div>
    </div>
</footer>



<script>
function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

let allProducts = typeof RICHEMONTE_PRODUCTS !== 'undefined' ? RICHEMONTE_PRODUCTS : [];
let currentCategory = 'Alle';

document.addEventListener('DOMContentLoaded', () => {
    loadCollections();
});

async function loadCollections() {
    const grid = document.getElementById('collectionsGrid');
    
    // Render initially from products-data.js fallback
    renderCollections(grid, getFilteredProducts());
    
    // 1. Try local storage cache for instant rendering
    const local = localStorage.getItem('richemont_products.json');
    if (local) {
        try {
            const data = JSON.parse(local);
            allProducts = data.products || RICHEMONTE_PRODUCTS;
            renderCollections(grid, getFilteredProducts());
        } catch(e) {
            console.warn(e);
        }
    }
    
    // 2. Fetch live data
    try {
        const res = await fetch('/api/products', { cache: 'no-store' });
        if (res.ok) {
            const data = await res.json();
            allProducts = data.products || RICHEMONTE_PRODUCTS;
            localStorage.setItem('richemont_products.json', JSON.stringify(data));
            renderCollections(grid, getFilteredProducts());
        }
    } catch(err) {
        console.error("Failed fetching live collection products:", err);
    }
}

function getFilteredProducts() {
    return allProducts;
}

function filterCategory(category, btnElement) {
    currentCategory = category;
    
    // Update active button state
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    if (btnElement) {
        btnElement.classList.add('active');
    }
    
    const grid = document.getElementById('collectionsGrid');
    renderCollections(grid, getFilteredProducts());
    updateCartCount();
}

function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    const countEl = document.getElementById('cartCount');
    if (countEl) {
        if (cart.length > 0) {
            countEl.textContent = cart.length;
            countEl.style.display = 'flex';
        } else {
            countEl.style.display = 'none';
        }
    }
}

function renderCollections(container, products) {
    if (!container) return;
    if (products.length === 0) {
        container.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding:100px 0; color:#666; font-size:12px; letter-spacing:2px; text-transform:uppercase;">Aktuell sind keine Stücke verfügbar.</div>';
        return;
    }
    
    container.innerHTML = '';
    updateCartCount();
    
    products.forEach((product, idx) => {
        const isDiscounted = product.discountPrice && Number(product.discountPrice) < Number(product.price);
        const formattedPrice = isDiscounted 
            ? `<span style="text-decoration: line-through; opacity: 0.4; margin-right: 8px;">${Number(product.price).toFixed(2)} €</span>` +
              `<span style="color: #d7b98a; font-weight: bold;">${Number(product.discountPrice).toFixed(2)} €</span>`
            : `${Number(product.price).toFixed(2)} €`;
            
        const saleBadge = isDiscounted 
            ? `<div style="position: absolute; top: 15px; left: 15px; background: #fff; color: #000; padding: 4px 10px; font-size: 8px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; z-index: 50; border: 1px solid rgba(0,0,0,0.12);">SALE</div>`
            : '';

        const itemDiv = document.createElement('div');
        itemDiv.className = 'collection-item';
        itemDiv.innerHTML = `
            ${saleBadge}
            <img loading="lazy" decoding="async" src="${product.image || 'Hemd-1.jpg'}" alt="${product.title}">
            <div class="collection-info">
                <h2>${product.title}</h2>
                <div style="font-size: 11px; letter-spacing: 1px; margin-top: 5px;">${formattedPrice}</div>
            </div>
        `;
        container.appendChild(itemDiv);
    });
}
</script>

</body>
</html>
