<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Richemont Admin Dashboard</title>
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: center;
      }
      h1 { color: #333; margin-bottom: 10px; }
      p { color: #666; font-size: 14px; }
      .success { color: #27ae60; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Richemont Admin Dashboard</h1>
      <p class="success">✓ Admin-Panel ist aktiv</p>
      <p>Die Webseiten-Bearbeitung wurde deaktiviert.</p>
    </div>
  </body>
</html>
