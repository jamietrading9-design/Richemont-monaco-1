<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom – Richemont</title>
<script src="supabase-client.js"></script>
<link rel="stylesheet" href="css/responsive.css">
<script src="products-data.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #000;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
}

nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2000;
    padding: 30px 40px;
    background: transparent;
    pointer-events: none;
    display: flex;    justify-content: space-between;

    align-items: center;
}

.menu-toggle {
    font-family: 'Great Vibes', cursive; 
    font-size: 32px;                     
    letter-spacing: 2px;               
    cursor: pointer;
    color: #fff;
    pointer-events: auto;
    display: inline-block;
    mix-blend-mode: difference;
    text-decoration: none;
    line-height: 1;                    
}

.cart-icon {
    width: 40px;
    height: 40px;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-decoration: none;
    color: #fff;
}

.cart-icon::before {
    content: "🛒";
    font-size: 20px;
    font-weight: 300;
    opacity: 0.9;
}

.cart-count {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #fff;
    color: #000;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
}

.logo-container {
    position: fixed;
    top: 30px; 
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 2100;
    white-space: nowrap;
}

.logo {
    font-family: 'Great Vibes', cursive;
    font-size: 28px; 
    color: #fff;
    text-decoration: none;
    transition: opacity 0.3s;
    display: inline-block;
}

.logo:hover { opacity: 0.7; }

.side-menu {
    position: fixed;
    top: 0;
    left: -320px;
    width: 300px;
    height: 100vh;
    padding-top: 120px;
    padding-bottom: 40px;
    background: #080808;
    border-right: 1px solid rgba(255,255,255,0.05);
    transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 3000;
    display: flex;
    flex-direction: column;
}
.side-menu.active { left: 0; }
.side-menu a {
    color: #888;
    text-decoration: none;
    padding: 20px 40px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}
.side-menu a:hover { color: #fff; }

.menu-cart-icon {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 40px;
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s;
}

.menu-cart-icon:hover {
    color: #fff;
}

.menu-cart-icon::before {
    display: none;
}
.side-menu a:hover { color: #fff; }

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 2500;
}
.overlay.active { opacity: 1; pointer-events: auto; }

.showroom-container {
    margin: 150px auto 0;
    padding: 0 40px;
    max-width: 1200px;
}

.showroom-intro {
    text-align: center;
    margin-bottom: 80px;
}

.showroom-intro h1 {
    font-size: 10px;
    letter-spacing: 8px;
    text-transform: uppercase;
    font-weight: 300;
    opacity: 0.6;
    margin-bottom: 10px;
}

.showroom-intro p {
    font-size: 14px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.showroom-item {
    display: flex;
    gap: 100px;
    margin-bottom: 250px;
    align-items: center;
}

.showroom-item:nth-child(even) { flex-direction: row-reverse; }

.item-image {
    flex: 1.4;
    height: 80vh;
    overflow: hidden;
}

.item-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1.5s ease;
}

.item-image:hover img { transform: scale(1.05); }

.item-details { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
}

.item-details h2 { 
    font-size: 32px; 
    font-weight: 300; 
    margin-bottom: 15px; 
    text-transform: uppercase; 
    letter-spacing: 2px;
}

.item-description {
    font-size: 14px;
    color: #777;
    line-height: 1.6;
    margin-bottom: 25px;
}

.category { 
    font-size: 9px; 
    letter-spacing: 4px; 
    color: #444; 
    text-transform: uppercase; 
    margin-bottom: 10px; 
}

.info-drawer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.info-drawer.open {
    max-height: 600px;
    margin-top: 25px;
    border-top: 1px solid #1a1a1a;
    padding-top: 25px;
}

.info-row {
    display: flex;
    margin-bottom: 15px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.label { color: #555; }
.value { color: #fff; }

.size-tags { display: flex; gap: 8px; }
.size-tag {
    border: 1px solid #333;
    padding: 4px 10px;
    font-size: 10px;
}

.info-btn {
    display: inline-block;
    padding: 10px 0;
    color: #fff;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-bottom: 1px solid #333;
    cursor: pointer;
    width: fit-content;
    transition: border-color 0.3s;
}

.info-btn:hover { border-color: #fff; }

.buy-btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 28px;
    min-width: 200px;
    color: #fff;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.95);
    background: transparent;
    text-align: center;
    transition: transform 0.25s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.buy-btn:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-color: #fff;
    transform: translateY(-1px);
}

footer {
    background: #000;
    padding: 100px 40px 40px;
    border-top: 1px solid rgba(255,255,255,0.05);
    text-align: center;
}

.footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
}

.footer-logo {
    font-family: 'Great Vibes', cursive;
    font-size: 40px;
    color: #fff;
    text-decoration: none;
}

.footer-links {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.footer-links a {
    color: #666;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}

.footer-links a:hover { color: #fff; }

.footer-bottom {
    margin-top: 60px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
}

@media (max-width: 768px) {
    nav { padding: 20px 20px; }
    .logo { font-size: 24px; }
    .showroom-container { padding: 0 20px; margin-top: 120px; }
    .showroom-item, .showroom-item:nth-child(even) { flex-direction: column; gap: 30px; margin-bottom: 120px; }
    .item-image { height: 60vh; width: 100%; }
    .item-details { text-align: center; align-items: center; }
    .item-details h2 { font-size: 24px; }
    .item-description { font-size: 13px; }
    .buy-btn { margin: 0 auto; }
    .info-row { width: 100%; }
    .footer-links { flex-direction: column; gap: 20px; }
}
.filter-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 60px;
    flex-wrap: wrap;
    padding: 0 20px;
}
.filter-btn {
    background: transparent;
    border: none;
    color: #555;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s, border-color 0.3s;
    padding: 6px 12px;
    border-bottom: 1px solid transparent;
}
.filter-btn:hover {
    color: #fff;
}
.filter-btn.active {
    color: #fff;
    border-bottom-color: #fff;
}
</style>
</head>
<body>

<nav>
    <a href="#" onclick="toggleMenu(); return false;" class="menu-toggle">RM</a>
    <a href="cart.html" class="cart-icon">
        <span id="cartCount" class="cart-count" style="display: none;">0</span>
    </a>
</nav>

<div class="logo-container">
    <a href="index.html" class="logo">Richemont Monaco</a>
</div>

<div class="side-menu" id="sideMenu">
        <a href="index.html">Home</a>
        <a href="collections.html">Collections</a>
        <a href="showroom.html">Showroom</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="menu-cart-icon">Warenkorb</a>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<main class="showroom-container">
    <header class="showroom-intro">
        <h1>Showroom</h1>
        <p>Designer Clothing</p>
    </header>

    <div class="filter-container">
        <button type="button" class="filter-btn active" onclick="filterCategory('Alle', this)">Alle</button>
    </div>

    <section id="showroomGrid">
        <div style="text-align:center; padding:100px 0; color:#666; font-size:12px; letter-spacing:2px; text-transform:uppercase;">
            Showroom wird geladen...
        </div>
    </section>
</main>

<footer>
    <div class="footer-content">
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="collections.html">Collections</a>
            <a href="showroom.html">Showroom</a>
            <a href="contact.html">Contact</a>
            <a href="#">Instagram</a>
            <a href="impressum.html">Impressum</a>
        </div>
        <div class="footer-bottom">&copy; 2026 Richemont Monaco</div>
    </div>
</footer>

<script>
function showCartToast(message) {
    let toast = document.getElementById('cartToast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'cartToast';
        toast.setAttribute('role', 'status');
        toast.setAttribute('aria-live', 'polite');
        toast.style.cssText = 'position:fixed;left:50%;bottom:32px;z-index:5000;transform:translate(-50%,20px);padding:14px 22px;background:#111;color:#fff;border:1px solid rgba(255,255,255,.35);font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:.25s ease;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;';
        document.body.appendChild(toast);
    }
    toast.textContent = message;
    requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translate(-50%,0)';
    });
    clearTimeout(toast.hideTimer);
    toast.hideTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%,20px)';
    }, 2600);
}

function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

function toggleInfo(id) {
    const drawer = document.getElementById(id);
    if (!drawer) return;
    const btn = drawer.previousElementSibling;
    drawer.classList.toggle('open');
    btn.innerText = drawer.classList.contains('open') ? "Details schließen" : "Weitere Details";
}

function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    const countEl = document.getElementById('cartCount');
    if (countEl) {
        if (cart.length > 0) {
            countEl.textContent = cart.length;
            countEl.style.display = 'flex';
        } else {
            countEl.style.display = 'none';
        }
    }
}

function addToCart(product) {
    let cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    cart.push(product);
    localStorage.setItem('richemont_cart', JSON.stringify(cart));
    updateCartCount();
    showCartToast('Zum Einkaufswagen hinzugefügt');
}

let allProducts = typeof RICHEMONTE_PRODUCTS !== 'undefined' ? RICHEMONTE_PRODUCTS : [];
let currentCategory = 'Alle';

function escapeProductHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[character]);
}

document.addEventListener('DOMContentLoaded', () => {
    loadShowroom();
    updateCartCount();
});

async function loadShowroom() {
    const grid = document.getElementById('showroomGrid');
    
    renderCategoryFilters(allProducts);
    renderProducts(grid, getFilteredProducts());
    
    const local = localStorage.getItem('richemont_products.json');
    if (local) {
        try {
            const data = JSON.parse(local);
            allProducts = data.products || RICHEMONTE_PRODUCTS;
            renderCategoryFilters(allProducts);
            renderProducts(grid, getFilteredProducts());
        } catch(e) {
            console.warn(e);
        }
    }
    
    try {
        const liveProducts = await window.RICHEMONTE_SUPABASE.fetchProducts();
        if (liveProducts) {
            allProducts = liveProducts;
            localStorage.setItem('richemont_products.json', JSON.stringify({ products: liveProducts }));
            renderCategoryFilters(allProducts);
            renderProducts(grid, getFilteredProducts());
        }
    } catch (err) {
        console.error("Failed fetching live showroom products:", err);
    }
}

function normalizeCategory(value) {
    return String(value || '').trim().toLowerCase();
}

function getFilteredProducts() {
    if (currentCategory === 'Alle') {
        return allProducts;
    }
    return allProducts.filter((p) => normalizeCategory(p.category) === normalizeCategory(currentCategory));
}

function renderCategoryFilters(products) {
    const container = document.querySelector('.filter-container');
    if (!container || !Array.isArray(products)) return;

    const categories = ['Alle', ...new Set(products
        .filter((p) => p && p.category)
        .map((p) => String(p.category).trim())
    )];

    container.innerHTML = categories.map((category) => {
        const activeClass = category === currentCategory ? ' active' : '';
        return `<button type="button" class="filter-btn${activeClass}" data-category="${escapeProductHtml(category)}">${escapeProductHtml(category)}</button>`;
    }).join('');

    container.querySelectorAll('.filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => filterCategory(btn.dataset.category, btn));
    });
}

function filterCategory(category, btnElement) {
    currentCategory = category;
    
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach((btn) => btn.classList.remove('active'));
    if (btnElement) {
        btnElement.classList.add('active');
    }
    
    const grid = document.getElementById('showroomGrid');
    renderProducts(grid, getFilteredProducts());
}

function bindShowroomActions(container) {
    if (!container) return;

    container.querySelectorAll('.info-btn').forEach((btn) => {
        const drawerId = btn.dataset.drawerId;
        btn.addEventListener('click', () => {
            const drawer = drawerId ? document.getElementById(drawerId) : null;
            if (!drawer) return;
            drawer.classList.toggle('open');
            btn.innerText = drawer.classList.contains('open') ? 'Details schließen' : 'Weitere Details';
        });
    });

    container.querySelectorAll('.buy-btn').forEach((btn) => {
        const index = Number(btn.dataset.productIndex);
        btn.addEventListener('click', () => {
            const product = Number.isFinite(index) && allProducts[index];
            if (product) {
                if (btn.classList.contains('buy-now')) {
                    window.location.href = `checkout.html?slug=${encodeURIComponent(product.slug || product.id || '')}`;
                } else {
                    addToCart(product);
                }
            }
        });
    });
}

function renderProducts(container, products) {
    if (!container) return;
    if (!products || products.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:100px 0; color:#666; font-size:12px; letter-spacing:2px; text-transform:uppercase;">Aktuell sind keine Stücke im Showroom verfügbar.</div>';
        return;
    }
    
    container.innerHTML = '';
    
    products.forEach((product, idx) => {
        const isDiscounted = product.discountPrice && Number(product.discountPrice) < Number(product.price);
        const formattedPrice = isDiscounted 
            ? `<span style="text-decoration: line-through; opacity: 0.4; margin-right: 10px;">${Number(product.price).toFixed(2)} €</span>` +
              `<span style="color: #fff; font-weight: bold;">${Number(product.discountPrice).toFixed(2)} €</span>`
            : `${Number(product.price).toFixed(2)} €`;
            
        const sizesHtml = Array.isArray(product.sizes) && product.sizes.length
            ? product.sizes.map((size) => `<div class="size-tag">${escapeProductHtml(size)}</div>`).join('')
            : '<div class="size-tag">Einheitsgröße</div>';
            
        const saleBadge = isDiscounted 
            ? `<div style="position: absolute; top: 20px; left: 20px; background: #fff; color: #000; padding: 6px 12px; font-size: 9px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; z-index: 100; border: 1px solid rgba(0,0,0,0.12);">SALE</div>`
            : '';

        const article = document.createElement('article');
        article.className = 'showroom-item';
        article.innerHTML = `
            <div class="item-image" style="position: relative;">
                ${saleBadge}
                <img loading="lazy" src="${escapeProductHtml(product.image || 'Hemd-1.jpg')}" alt="${escapeProductHtml(product.title || 'Hemd')}">
            </div>
            <div class="item-details">
                <span class="category">${escapeProductHtml(product.number || String(idx + 1).padStart(2, '0'))}</span>
                <h2>${escapeProductHtml(product.title || 'Richemont Produkt')}</h2>
                <p class="item-description">
                    ${escapeProductHtml(product.description || 'Ein exklusives Designerstück aus der Richemont Monaco Kollektion.')}
                </p>

                <button type="button" class="info-btn" data-drawer-id="info-${idx}">Weitere Details</button>

                <div class="info-drawer" id="info-${idx}">
                    <div class="info-row">
                        <span class="label">Material</span>
                        <span class="value">${escapeProductHtml(product.material || 'Nicht angegeben')}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Größen</span>
                        <div class="size-tags">
                            ${sizesHtml}
                        </div>
                    </div>
                    <div class="info-row" style="margin-top: 20px;">
                        <span class="label">Preis</span>
                        <span class="value">${formattedPrice}</span>
                    </div>
                    <div style="display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap;">
                        <button type="button" class="buy-btn" data-product-index="${idx}" style="background: transparent; border: 1px solid #fff; cursor: pointer;">In Einkaufswagen</button>
                        <button type="button" class="buy-btn buy-now" data-product-index="${idx}" style="background: transparent; border: 1px solid #fff; cursor: pointer;">Jetzt kaufen</button>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(article);
    });

    bindShowroomActions(container);
}
</script>

</body>
</html>
