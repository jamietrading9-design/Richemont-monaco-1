<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buchhaltung Login</title>
    <link rel="stylesheet" href="../css/responsive.css" />
    <style>
      body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; font-family:'Inter',sans-serif; }
      .card { width:min(540px,96%); background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:24px; padding:32px; box-shadow:0 24px 60px rgba(0,0,0,0.5); }
      h1 { margin:0 0 16px; font-size:24px; letter-spacing:0.2em; text-transform:uppercase; }
      .field { width:100%; margin:14px 0; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,0.15); padding:12px 8px; color:#fff; font-size:14px; }
      .field:focus { outline:none; border-bottom-color:#fff; }
      .btn { width:100%; margin-top:20px; padding:14px 18px; color:#000; background:#fff; border:none; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; }
      .logo-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; }
      .logo { color:#fff; font-size:22px; font-weight:700; letter-spacing:0.2em; text-decoration:none; text-transform:uppercase; }
      .error { display:none; color:#ff8888; font-size:13px; margin-bottom:10px; }
      .small { color:#999; font-size:12px; margin-top:8px; }
    </style>
  </head>
  <body>
    <div class="logo-container"><a class="logo" href="/index.html">Richemont Monaco</a></div>
    <div class="card">
      <h1>Buchhaltung Login</h1>
      <p>Bitte melden Sie sich über das Admin-Login an.</p>
      <p class="small"><a href="/admin.html" style="color:#fff; text-decoration:underline;">Zum Admin-Login</a></p>
      <p class="small"><a href="/index.html" style="color:#fff; text-decoration:underline;">Zurück zur Startseite</a></p>
    </div>

    <script>
      window.location.replace('/admin.html');
    </script>
  </body>
</html>
