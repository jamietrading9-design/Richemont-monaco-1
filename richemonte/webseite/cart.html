<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warenkorb – Richemont</title>
<link rel="stylesheet" href="css/responsive.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #000;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
}

nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2000;
    padding: 30px 40px;
    background: transparent;
    pointer-events: none;
    display: flex;    justify-content: space-between;

    align-items: center;
}

.menu-toggle {
    font-family: 'Great Vibes', cursive; 
    font-size: 32px;                     
    letter-spacing: 2px;               
    cursor: pointer;
    color: #fff;
    pointer-events: auto;
    display: inline-block;
    mix-blend-mode: difference;
    text-decoration: none;
    line-height: 1;
    transition: opacity 0.3s;
}

.menu-toggle:hover {
    opacity: 0.7;
}

.cart-icon {
    width: 40px;
    height: 40px;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-decoration: none;
    color: #fff;
}

.cart-icon::before {
    content: '🛒';
    font-size: 20px;
    opacity: 0.9;
}

.logo {
    font-family: 'Great Vibes', cursive;
    font-size: 28px; 
    color: #fff;
    text-decoration: none;
    transition: opacity 0.3s;
    display: inline-block;
}

.logo-container {
    position: fixed;
    top: 30px; 
    left: 50%;
    transform: translateX(-50%);
    z-index: 2100;
    white-space: nowrap;
    text-align: center;
}
.cart-item,
.cart-summary,
.back-link,
.empty-cart p,
.empty-cart a,
.footer-links a,
.footer-bottom {
    font-family: 'Inter', sans-serif;
}

.cart-header h1 {
    font-size: 36px;
    font-weight: 300;
    letter-spacing: 1px;
}

.item-name {
    font-size: 18px;
    font-weight: 500;
}

.item-details {
    font-size: 13px;
    color: #ccc;
}

.summary-row {
    font-size: 15px;
}

    .back-link {
    position: fixed;
    top: calc(30px + 32px + 8px); /* nav padding + menu-toggle size + gap */
    right: 40px; /* place on right side */
    z-index: 2200;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    letter-spacing: 0;
    text-transform: none;
    transition: color 0.3s, transform 0.15s;
    margin: 0;
    font-weight: 300;
    display: flex;
    align-items: center;
    padding: 6px 8px;
    border-radius: 4px;
    background: transparent;
}

.back-link:hover {
    color: #ccc;
    transform: translateX(2px);
}

.side-menu {
    position: fixed;
    top: 0;
    left: -320px;
    width: 300px;
    height: 100vh;
    padding-top: 120px;
    padding-bottom: 40px;
    background: #080808;
    border-right: 1px solid rgba(255,255,255,0.05);
    transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 3000;
    display: flex;
    flex-direction: column;
}

.side-menu.active { left: 0; }

.side-menu a {
    color: #888;
    text-decoration: none;
    padding: 20px 40px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}

.side-menu a:hover { color: #fff; }

.menu-cart-icon {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 40px;
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s;
    text-decoration: none;
}

.menu-cart-icon:hover { color: #fff; }

.menu-cart-icon::before {
    display: none;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 2500;
}

.overlay.active { opacity: 1; pointer-events: auto; }

main {
    margin-top: 100px;
    padding: 40px 20px;
}

.cart-container {
    max-width: 1000px;
    margin: 0 auto;
}

.cart-header {
    text-align: center;
    margin-bottom: 60px;
}

.cart-header h1 {
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.cart-items {
    display: flex;
    flex-direction: column;
    gap: 40px;
    margin-bottom: 60px;
}

.cart-item {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 30px;
    padding-bottom: 40px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.item-image {
    width: 150px;
    height: 150px;
    overflow: hidden;
    background: #050505;
}

.item-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.item-info {
    display: flex;
    flex-direction: column;
}

.item-name {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.item-details {
    font-size: 12px;
    color: #999;
}

.item-price {
    font-size: 18px;
    font-weight: 400;
}

.remove-btn {
    display: inline-block;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    width: fit-content;
}

.remove-btn:hover {
    border-color: #fff;
    background: rgba(255,255,255,0.05);
}

.cart-summary {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 40px;
    margin-bottom: 40px;
}

.summary-row {
    display: flex;
    margin-bottom: 15px;
    font-size: 14px;
}

.summary-row.total {
    font-size: 18px;
    font-weight: 600;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 15px;
    margin-top: 15px;
}

.checkout-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.95);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
}

.checkout-btn:hover {
    background: rgba(255,255,255,0.08);
    transform: translateY(-1px);
}

.cart-actions {
    display: flex;
    gap: 12px;
    align-items: center;
}

.cart-actions .checkout-btn {
    width: auto;
    flex: 1 1 auto;
}

.clear-btn {
    padding: 12px 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
}

.clear-btn:hover {
    background: rgba(255,107,107,0.06);
    border-color: rgba(255,107,107,0.9);
    color: #ff6b6b;
}

.cart-undo {
    border-radius: 6px;
}

.empty-cart {
    text-align: center;
    padding: 80px 20px;
}

.empty-cart p {
    font-size: 12px;
    letter-spacing: 2px;
    color: #666;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.empty-cart a {
    display: inline-block;
    padding: 12px 24px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s;
}

.empty-cart a:hover {
    border-color: #fff;
    background: rgba(255,255,255,0.05);
}

footer {
    background: #000;
    padding: 80px 40px 40px;
    border-top: 1px solid rgba(255,255,255,0.05);
    text-align: center;
}

.footer-logo {
    font-family: 'Great Vibes', cursive;
    color: #fff;
    text-decoration: none;
    display: block;
    margin-bottom: 40px;
}

.footer-links {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin-bottom: 60px;
    flex-wrap: wrap;
}

.footer-links a {
    color: #666;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}

.footer-links a:hover {
    color: #fff;
}

.footer-bottom {
    font-size: 9px;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
}

@media (max-width: 768px) {
    nav {
        padding: 20px 20px;
    }

    .menu-toggle {
        font-size: 24px;
    }

    .logo {
        font-size: 20px;
    }

    .back-link {
        left: 20px;
        font-size: 10px;
    }

    .cart-item {
        grid-template-columns: 100px 1fr;
        gap: 20px;
    }

    .item-image {
        width: 100px;
        height: 100px;
    }

    .cart-summary {
        padding: 20px;
    }

    main {
        padding: 20px 15px;
    }
}

@media (max-width: 480px) {
    main {
        padding: 15px 10px;
        margin-top: 70px;
    }

    .cart-header h1 {
        font-size: 24px;
    }

    .item-image {
        width: 80px;
        height: 80px;
    }

    .item-name {
        font-size: 14px;
    }

    footer {
        padding: 50px 20px 25px;
    }
}

.checkout-panel {
    display: none;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 30px;
    margin-top: 40px;
}

.checkout-panel.active {
    display: block;
}

.checkout-panel h2 {
    font-size: 24px;
    margin-bottom: 16px;
}

.checkout-panel .field {
    margin-bottom: 18px;
}

.checkout-panel label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    color: #ccc;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.checkout-panel input,
.checkout-panel textarea {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 14px;
}

.checkout-panel textarea {
    min-height: 120px;
    resize: vertical;
}

.checkout-panel .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
}

.checkout-panel .button-row button {
    border: 1px solid rgba(255,255,255,0.95);
    background: transparent;
    color: #fff;
    cursor: pointer;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.checkout-panel .button-row button.primary {
    background: #fff;
    color: #050505;
    border-top-color: #fff;
}

.checkout-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 4000;
    padding: 20px;
}

.checkout-overlay.active {
    display: flex;
}

.loader-card {
    width: min(420px, 100%);
    padding: 30px;
    border-radius: 24px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: center;
}

.loader-ring {
    width: 84px;
    height: 84px;
    border: 8px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 22px;
}

.loader-ring.done {
    animation: none;
    border-color: rgba(255,255,255,0.15);
    border-top-color: #66cc33;
    position: relative;
}

.loader-ring.done::after {
    display: none;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
.bbb1{

padding-top: 5%;}

<nav>

    <a href="cart.html" class="cart-icon">
        <span id="cartCount" class="cart-count" style="display: none;">0</span>

<div class="logo-container">

<main>
    <div class="cart-container">
        <!-- back link removed per request -->
        <div class="cart-header">
            <h1>Warenkorb</h1>
        </div>

        <div id="cartContent">
            <div class="empty-cart">
                <p>Dein Warenkorb ist leer</p>
                <a href="collections.html">Weiter zum Einkaufen</a>

            </div>
            <div class="field">
                <label for="checkoutEmail">E-Mail</label>
                <input id="checkoutEmail" type="email" placeholder="name@beispiel.de">
            </div>
            <div class="field">
                <label for="checkoutAddress">Adresse</label>
                <input id="checkoutAddress" type="text" placeholder="Straße, Hausnummer, PLZ, Stadt">
            </div>
            <div class="field">
                <label for="checkoutIban">IBAN</label>
                <input id="checkoutIban" type="text" placeholder="Deine IBAN ">
            </div>
            <div class="field">
                <label for="checkoutNotes">Weiter Infos?</label>
                <textarea id="checkoutNotes" placeholder="Wunschtext, Lieferhinweise oder Geschenkoptionen"></textarea>
            </div>
            <div class="button-row">

<footer>

    </a>
    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="collections.html">Collections</a>
        <a href="showroom.html">Showroom</a>
        <a href="contact.html">Contact</a>
        <a href="impressum.html">Impressum</a>
    </div>

</footer>
<div class="indes">
</div>
<div class="bbb1">
    <button>Ausloggen</button>
</div>

<div id="checkoutOverlay" class="checkout-overlay">
    <div class="loader-card">
        <div id="loaderRing" class="loader-ring"></div>
        <div id="loaderText" style="color:#fff; font-size:1rem; letter-spacing:0.04em;">Wir verarbeiten Ihre Bestellung ...</div>
    </div>
</div>

<script>
function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    const countEl = document.getElementById('cartCount');
    if (cart.length > 0) {
        countEl.textContent = cart.length;
        countEl.style.display = 'flex';
    } else {
        countEl.style.display = 'none';
    }
}

function renderCart() {
    const cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    const content = document.getElementById('cartContent');
    
    updateCartCount();

    if (cart.length === 0) {
        content.innerHTML = `
            <div class="empty-cart">
                <p>Dein Warenkorb ist leer</p>
                <a href="collections.html">Weiter zum Einkaufen</a>
            </div>
        `;
        return;
    }

    let total = 0;
    const itemsHTML = cart.map((item, idx) => {
        const price = item.discountPrice || item.price;
        total += Number(price);
        return `
            <div class="cart-item">
                <div class="item-image">
                    <img src="${item.image || 'Hemd-1.jpg'}" alt="${item.title}">
                </div>
                <div class="item-info">
                    <div>
                        <h3 class="item-name">${item.title}</h3>
                        <div class="item-details">
                            ${item.selectedSize ? `Größe: ${item.selectedSize}<br>` : ''}
                            Material: ${item.material || 'N/A'}
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${idx})">Löschen</button>
                </div>
                <div style="text-align: right; display: flex; flex-direction: column; justify-content: space-between;">
                    <div class="item-price">${Number(price).toFixed(2)} €</div>
                </div>
            </div>
        `;
    }).join('');

    content.innerHTML = `
        <div class="cart-items">
            ${itemsHTML}
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span>${total.toFixed(2)} €</span>
            </div>
            <div class="summary-row">
                <span>Versand</span>
                <span>Kostenlos</span>
            </div>
            <div class="summary-row total">
                <span>Gesamt</span>
                <span>${total.toFixed(2)} €</span>
            </div>
        </div>

        <div class="cart-actions">
            <button class="checkout-btn" onclick="checkout()">Jetzt bestellen</button>
        </div>
    `;
}

function removeFromCart(index) {
    let cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('richemont_cart', JSON.stringify(cart));
    renderCart();
}

function showCheckout() {
    const panel = document.getElementById('checkoutPanel');
    panel.classList.add('active');
    document.getElementById('checkoutName').focus();
}

function hideCheckout() {
    const panel = document.getElementById('checkoutPanel');
    panel.classList.remove('active');
}

function validateCheckoutForm() {
    const name = document.getElementById('checkoutName').value.trim();
    const email = document.getElementById('checkoutEmail').value.trim();
    const address = document.getElementById('checkoutAddress').value.trim();
    const iban = document.getElementById('checkoutIban').value.trim();
    return name && email && address && iban;
}

async function submitCheckout() {
    if (!validateCheckoutForm()) {
        showInlineCheckoutError('Bitte füllen Sie alle Felder aus.');
        return;
    }

    const cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    if (!cart.length) {
        showInlineCheckoutError('Ihr Warenkorb ist leer.');
        return;
    }

    const items = cart.map(item => ({
        productId: item.productId || item.id || item.slug,
        title: item.title || 'Artikel',
        quantity: Number(item.quantity) || 1,
        price: Number(item.discountPrice || item.price) || 0
    }));
    const total = items.reduce((sum, item) => sum + item.price * item.quantity, 0);

    const payload = {
        items,
        customer: {
            name: document.getElementById('checkoutName').value.trim(),
            email: document.getElementById('checkoutEmail').value.trim(),
            address: document.getElementById('checkoutAddress').value.trim()
        },
        notes: document.getElementById('checkoutNotes').value.trim(),
        paymentMethod: 'banktransfer',
        iban: document.getElementById('checkoutIban').value.trim()
    };

    const overlay = document.getElementById('checkoutOverlay');
    const loaderText = document.getElementById('loaderText');
    const loaderRing = document.getElementById('loaderRing');
    overlay.classList.add('active');
    loaderRing.classList.remove('done');
    loaderText.textContent = 'Wir verarbeiten Ihre Bestellung...';

    try {
        const response = await fetch('/api/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await response.json();

        await new Promise(resolve => setTimeout(resolve, 2000));

        if (!data.success) {
            overlay.classList.remove('active');
            console.error('Checkout error:', data.error || 'Bestellung konnte nicht abgeschlossen werden.');
            // leave cart displayed; no browser alert
            return;
        }

        loaderRing.classList.add('done');
        loaderText.textContent = `Bestellnummer: ${data.orderId}`;

        setTimeout(() => {
            overlay.classList.remove('active');
            localStorage.removeItem('richemont_cart');
            renderCart();
            hideCheckout();
            document.getElementById('cartContent').innerHTML = `
                <div class="empty-cart">
                    <p>Danke! Ihre Bestellung wurde erfolgreich aufgegeben.</p>
                    <p style="margin-top:16px; color:#fff; font-weight:600;">Bestellnummer: ${data.orderId}</p>
                    <a href="#" onclick="goBackOrCollections(event)">Weiter einkaufen</a>
                </div>
            `;
            // Bestellung erfolgreich — UI updated above. No browser alert.
        }, 800);
    } catch (error) {
        overlay.classList.remove('active');
        console.error('Checkout error', error);
        // Bestellung fehlgeschlagen; show inline error instead of browser alert
        const cartContent = document.getElementById('cartContent');
        if (cartContent) {
            const err = document.createElement('div');
            err.className = 'checkout-error';
            err.textContent = 'Bestellung fehlgeschlagen. Bitte versuchen Sie es später erneut.';
            cartContent.prepend(err);
            setTimeout(() => err.remove(), 6000);
        }
    }
}

function checkout() {
    showCheckout();
}

document.addEventListener('DOMContentLoaded', () => {
    renderCart();
    document.getElementById('checkoutSubmit').addEventListener('click', submitCheckout);
    document.getElementById('checkoutCancel').addEventListener('click', hideCheckout);
});

function showInlineCheckoutError(msg) {
    const panel = document.getElementById('checkoutPanel');
    if (!panel) return;
    let err = panel.querySelector('.checkout-error');
    if (err) err.remove();
    err = document.createElement('div');
    err.className = 'checkout-error';
    err.style.color = '#ff6b6b';
    err.style.marginBottom = '10px';
    err.textContent = msg;
    panel.prepend(err);
    setTimeout(() => err.remove(), 5000);
}

// clearCart removed per user request (Alles löschen button removed)

function goBackOrCollections(e) {
    if (e) e.preventDefault();
    try {
        // Prefer history back if referrer exists and is same origin
        if (document.referrer && new URL(document.referrer).origin === location.origin) {
            history.back();
            return;
        }
    } catch (err) {
        // ignore
    }
    // Fallback to collections
    location.href = 'collections.html';
}
</script>
