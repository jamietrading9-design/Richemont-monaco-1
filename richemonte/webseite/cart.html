<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Warenkorb – Richemont Monaco</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #000;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
}

nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2000;
    padding: 30px 40px;
    background: transparent;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.menu-toggle {
    font-family: 'Great Vibes', cursive;
    font-size: 32px;
    letter-spacing: 2px;
    cursor: pointer;
    color: #fff;
    pointer-events: auto;
    display: inline-block;
    mix-blend-mode: difference;
    text-decoration: none;
    line-height: 1;
}

.cart-icon {
    width: 40px;
    height: 40px;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-decoration: none;
    color: #fff;
}

.cart-icon::before {
    content: "🛒";
    font-size: 20px;
    font-weight: 300;
    opacity: 0.9;
}

.cart-count {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #fff;
    color: #000;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
}

.logo-container {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2100;
    white-space: nowrap;
    text-align: center;
}

.logo {
    font-family: 'Great Vibes', cursive;
    font-size: 28px;
    color: #fff;
    text-decoration: none;
    transition: opacity 0.3s;
    display: inline-block;
}

.logo:hover {
    opacity: 0.7;
}

.back-link {
    display: block;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.3s;
    margin-bottom: 40px;
    font-weight: 300;
}

.back-link:hover {
    color: #999;
}

.side-menu {
    position: fixed;
    top: 0;
    left: -320px;
    width: 300px;
    height: 100vh;
    padding-top: 120px;
    background: #080808;
    border-right: 1px solid rgba(255,255,255,0.05);
    transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 3000;
    display: flex;
    flex-direction: column;
}

.side-menu.active { left: 0; }

.side-menu a {
    color: #888;
    text-decoration: none;
    padding: 20px 40px;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}

.side-menu a:hover { color: #fff; }

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 2500;
}

.overlay.active { opacity: 1; pointer-events: auto; }

main {
    margin-top: 100px;
    padding: 40px 20px;
}

.cart-container {
    max-width: 1000px;
    margin: 0 auto;
}

.cart-header {
    text-align: center;
    margin-bottom: 60px;
}

.cart-header h1 {
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.cart-items {
    display: flex;
    flex-direction: column;
    gap: 40px;
    margin-bottom: 60px;
}

.cart-item {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 30px;
    padding-bottom: 40px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.item-image {
    width: 150px;
    height: 150px;
    overflow: hidden;
    background: #050505;
}

.item-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.item-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.item-name {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.item-details {
    font-size: 12px;
    color: #999;
}

.item-price {
    font-size: 18px;
    font-weight: 400;
}

.remove-btn {
    display: inline-block;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    width: fit-content;
}

.remove-btn:hover {
    border-color: #fff;
    background: rgba(255,255,255,0.05);
}

.cart-summary {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 40px;
    margin-bottom: 40px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 14px;
}

.summary-row.total {
    font-size: 18px;
    font-weight: 600;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 15px;
    margin-top: 15px;
}

.checkout-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.95);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
}

.checkout-btn:hover {
    background: rgba(255,255,255,0.08);
    transform: translateY(-1px);
}

.empty-cart {
    text-align: center;
    padding: 80px 20px;
}

.empty-cart p {
    font-size: 12px;
    letter-spacing: 2px;
    color: #666;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.empty-cart a {
    display: inline-block;
    padding: 12px 24px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s;
}

.empty-cart a:hover {
    border-color: #fff;
    background: rgba(255,255,255,0.05);
}

footer {
    background: #000;
    padding: 80px 40px 40px;
    border-top: 1px solid rgba(255,255,255,0.05);
    text-align: center;
}

.footer-logo {
    font-family: 'Great Vibes', cursive;
    color: #fff;
    text-decoration: none;
    display: block;
    margin-bottom: 40px;
}

.footer-links {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin-bottom: 60px;
    flex-wrap: wrap;
}

.footer-links a {
    color: #666;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: color 0.3s;
}

.footer-links a:hover {
    color: #fff;
}

.footer-bottom {
    font-size: 9px;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
}

@media (max-width: 768px) {
    nav {
        padding: 20px 20px;
    }

    .menu-toggle {
        font-size: 24px;
    }

    .logo {
        font-size: 20px;
    }

    .back-link {
        left: 20px;
        font-size: 10px;
    }

    .cart-item {
        grid-template-columns: 100px 1fr;
        gap: 20px;
    }

    .item-image {
        width: 100px;
        height: 100px;
    }

    .cart-summary {
        padding: 20px;
    }

    main {
        padding: 20px 15px;
    }
}

@media (max-width: 480px) {
    main {
        padding: 15px 10px;
        margin-top: 70px;
    }

    .cart-header h1 {
        font-size: 24px;
    }

    .item-image {
        width: 80px;
        height: 80px;
    }

    .item-name {
        font-size: 14px;
    }

    footer {
        padding: 50px 20px 25px;
    }
}
</style>
</head>
<body>

<nav>
    <a href="#" onclick="toggleMenu(); return false;" class="menu-toggle">RM</a>
    <a href="cart.html" class="cart-icon">
        <span id="cartCount" class="cart-count" style="display: none;">0</span>
    </a>
</nav>

<div class="side-menu" id="sideMenu">
    <a href="index.html">Home</a>
    <a href="collections.html">Collections</a>
    <a href="showroom.html">Showroom</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html" class="menu-cart-icon">Warenkorb</a>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<main>
    <div class="cart-container">
        <a href="collections.html" class="back-link">← Zurück</a>
        <div class="cart-header">
            <h1>Warenkorb</h1>
        </div>

        <div id="cartContent">
            <div class="empty-cart">
                <p>Dein Warenkorb ist leer</p>
                <a href="collections.html">Weiter zum Einkaufen</a>
            </div>
        </div>
    </div>
</main>

<footer>
    <a href="index.html" class="footer-logo">Richemont Monaco</a>
    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="collections.html">Collections</a>
        <a href="showroom.html">Showroom</a>
        <a href="contact.html">Contact</a>
        <a href="impressum.html">Impressum</a>
    </div>
    <div class="footer-bottom">&copy; 2026 Richemont Monaco</div>
</footer>

<script>
function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    const countEl = document.getElementById('cartCount');
    if (cart.length > 0) {
        countEl.textContent = cart.length;
        countEl.style.display = 'flex';
    } else {
        countEl.style.display = 'none';
    }
}

function renderCart() {
    const cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    const content = document.getElementById('cartContent');
    
    updateCartCount();

    if (cart.length === 0) {
        content.innerHTML = `
            <div class="empty-cart">
                <p>Dein Warenkorb ist leer</p>
                <a href="collections.html">Weiter zum Einkaufen</a>
            </div>
        `;
        return;
    }

    let total = 0;
    const itemsHTML = cart.map((item, idx) => {
        const price = item.discountPrice || item.price;
        total += Number(price);
        return `
            <div class="cart-item">
                <div class="item-image">
                    <img src="${item.image || 'Hemd-1.jpg'}" alt="${item.title}">
                </div>
                <div class="item-info">
                    <div>
                        <h3 class="item-name">${item.title}</h3>
                        <div class="item-details">
                            ${item.selectedSize ? `Größe: ${item.selectedSize}<br>` : ''}
                            Material: ${item.material || 'N/A'}
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${idx})">Löschen</button>
                </div>
                <div style="text-align: right; display: flex; flex-direction: column; justify-content: space-between;">
                    <div class="item-price">${Number(price).toFixed(2)} €</div>
                </div>
            </div>
        `;
    }).join('');

    content.innerHTML = `
        <div class="cart-items">
            ${itemsHTML}
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span>${total.toFixed(2)} €</span>
            </div>
            <div class="summary-row">
                <span>Versand</span>
                <span>Kostenlos</span>
            </div>
            <div class="summary-row total">
                <span>Gesamt</span>
                <span>${total.toFixed(2)} €</span>
            </div>
        </div>

        <button class="checkout-btn" onclick="checkout()">Zur Kasse</button>
    `;
}

function removeFromCart(index) {
    let cart = JSON.parse(localStorage.getItem('richemont_cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('richemont_cart', JSON.stringify(cart));
    renderCart();
}

function checkout() {
    alert('Vielen Dank für deinen Einkauf! Diese Funktionalität wird in Kürze vollständig implementiert.');
}

document.addEventListener('DOMContentLoaded', () => {
    renderCart();
});
</script>

</body>
</html>
